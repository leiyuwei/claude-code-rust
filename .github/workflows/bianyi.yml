name: 自定义发布 - 构建和发布新版本

on:
  workflow_dispatch:
    inputs:
      target:
        description: "The target triple for the Rust build."
        required: true
        default: x86_64-pc-windows-msvc

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: 获取代码仓库
        uses: actions/checkout@v4

      - name: 安装指定的Rust工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable  # 指定要使用的Rust工具链版本

      - name: 添加构建目标
        run: rustup target add ${{ inputs.target }}

      - name: 构建Release版本
        run: cargo build --release --target ${{ inputs.target }}

      - name: 上传资源到发布
        uses: softprops/action-gh-release@v1
        with:
          files: target/${{ inputs.target }}/release/${{ matrix.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          name: 释放 ${{ matrix.os }}
          
